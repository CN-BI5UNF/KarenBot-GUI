name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 / libadwaita / PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Compile GUI
        run: python3 -m compileall -q gui

      - name: Verify GTK4 import
        run: |
          python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, Gtk
          assert Gtk.get_major_version() == 4
          print("GTK", Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())
          print("Adw", Adw.get_major_version(), Adw.get_minor_version())
          PY

      - name: Verify non-GTK helpers
        run: python3 -c "import gui.paths, gui.identity; print('helpers ok')"

      - name: Verify module layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ("gui/app.py", "gui/local_server.py", "gui/pages/overview.py"):
              assert Path(rel).is_file(), rel
          print("gui module layout ok")
          PY
